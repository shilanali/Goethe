name: Goethe B1 Daily

on:
  schedule:
    # 08:00 و14:00 و20:00 بتوقيت دمشق (UTC+3) = 05:00 و11:00 و17:00 UTC
    - cron: "0 5,11,17 * * *"
  workflow_dispatch:        # تشغيل يدوي للتجربة

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gTTS
      - run: python goethe_b1_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
