name: Goethe B1 Every 2 Hours

on:
  schedule:
    # 06:00 إلى 22:00 بتوقيت دمشق (UTC+3) = 03:00 إلى 19:00 UTC
    - cron: "0 3,5,7,9,11,13,15,17,19 * * *"
  workflow_dispatch:        # تشغيل يدوي للتجربة

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gTTS
      - run: python goethe_b1_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
